[package]
name = "query2table"
version = "0.8.0"
description = "Natural-language research queries to structured tables"
authors = ["hightemp"]
edition = "2021"

[lib]
name = "query2table_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "brotli", "rustls-tls", "charset", "http2", "macos-system-configuration"] }
governor = "0.8"
url = "2"
async-trait = "0.1"
scraper = "0.22"
ammonia = "4"
encoding_rs = "0.8"
strsim = "0.11"
regex = "1"
csv = "1.4.0"
rust_xlsxwriter = "0.94.0"
pdf-extract = "0.10.0"
base64 = "0.22.1"
htmd = "0.1"
calamine = { version = "0.36", features = ["chrono"] }
quick-xml = "0.38"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
hayro = "0.8"
futures = "0.3"

[dev-dependencies]
tempfile = "3"
mockall = "0.13"
wiremock = "0.6"

[features]
e2e = []
