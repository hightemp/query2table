name: Release

on:
  push:
    tags:
      - 'v*'
  # Rebuilds only the Android APK of an existing release (e.g. after fixing its build).
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to add the Android APK to, e.g. v0.9.0
        required: true

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ''
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Read release notes from changelog
        id: release-notes
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const version = context.ref.replace('refs/tags/v', '');
            const sections = fs.readFileSync('CHANGELOG.md', 'utf8').split(/^## /m);
            const section = sections.find(text => text.startsWith(`${version} —`));
            if (!section) throw new Error(`Missing changelog section for ${version}`);
            core.setOutput('body', section.slice(section.indexOf('\n') + 1).trim());

      # Installed apps take only updates signed with this key; a release without it would break updates.
      - name: Check the update signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::No TAURI_SIGNING_PRIVATE_KEY secret. See make updater-keys."
            exit 1
          fi
          if ! grep -q '"pubkey": "[^"]' src-tauri/tauri.conf.json; then
            echo "::error::No updater public key in src-tauri/tauri.conf.json. See make updater-keys."
            exit 1
          fi

      # Signs the update files and publishes latest.json, which installed apps check.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Query2Table ${{ github.ref_name }}'
          releaseBody: ${{ steps.release-notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }} --config src-tauri/tauri.updater.conf.json

  android:
    # Runs after the desktop builds, which create the GitHub release this APK is added to.
    needs: release
    # One failed desktop build should not hold back the APK.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check the signing key
        id: key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the Android APK is not built. See make android-keystore."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Java
        if: steps.key.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner has the Android SDK (ANDROID_HOME); add the NDK and the platform the app targets.
      - name: Install Android NDK
        if: steps.key.outputs.present == 'true'
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "ndk;28.0.12433566" "platforms;android-36" "build-tools;35.0.0" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.0.12433566" >> "$GITHUB_ENV"

      - name: Install Rust stable
        if: steps.key.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Rust cache
        if: steps.key.outputs.present == 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - name: Setup Node.js
        if: steps.key.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        if: steps.key.outputs.present == 'true'
        run: npm ci

      - name: Write the signing key
        if: steps.key.outputs.present == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=${ANDROID_KEY_ALIAS:-query2table}"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > src-tauri/gen/android/keystore.properties

      - name: Build the APK
        if: steps.key.outputs.present == 'true'
        run: npm run tauri android build -- --apk --target aarch64 --target armv7 --target x86_64

      - name: Add the APK to the release
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${TAG#v}"
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "Query2Table_${version}_android.apk"
          gh release upload "$TAG" "Query2Table_${version}_android.apk" --clobber

      # The app checks the same latest.json as the desktop apps and verifies this signature.
      - name: Sign the APK for updates and list it in latest.json
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version="${TAG#v}"
          apk="Query2Table_${version}_android.apk"
          npm run tauri signer sign -- --app-version "$version" "$apk"
          gh release download "$TAG" --pattern latest.json --output latest.json --clobber
          url="https://github.com/${{ github.repository }}/releases/download/$TAG/$apk"
          jq --arg url "$url" --arg sig "$(cat "$apk.sig")" \
            '.platforms["android-universal"] = {url: $url, signature: $sig}' latest.json > latest.next.json
          mv latest.next.json latest.json
          gh release upload "$TAG" "$apk.sig" latest.json --clobber
